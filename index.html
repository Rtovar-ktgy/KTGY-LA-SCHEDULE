<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTGY LA Studio — Weekly Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ECE8DE; --paper-line:#D8D2C2; --ink:#20262B; --ink-soft:#565F66;
    --redline:#C4401D; --off-hatch-a:#DCD6C8; --off-hatch-b:#CBC4B2;
    --pto-hatch-a:#E6D6D6; --pto-hatch-b:#D6BEBE;
    --card:#F7F5EF; --border:#B9B2A0; --row-alt:#F1EEE5; --ok:#4B8A5E; --warn:#B8862B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper);
    background-image:linear-gradient(var(--paper-line) 1px, transparent 1px), linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size:28px 28px; color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; padding:24px;
  }
  .sheet{ max-width:1700px; margin:0 auto; background:var(--card); border:1px solid var(--border);
    box-shadow:0 2px 0 rgba(32,38,43,0.08), 0 12px 30px rgba(32,38,43,0.10); }
  .titleblock{ display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; border-bottom:2px solid var(--ink); }
  .tb-cell{ padding:14px 18px; border-right:1px solid var(--border); }
  .tb-cell:last-child{border-right:none;}
  .tb-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:4px; }
  .studio-name{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; letter-spacing:-0.01em; background:transparent; border:none; color:var(--ink); width:100%; padding:0; }
  .studio-name:focus{outline:none; border-bottom:1px dashed var(--ink-soft);}
  .sheet-title{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--redline); margin-top:2px; }
  .week-nav{display:flex; align-items:center; gap:8px;}
  .week-nav button{ font-family:'IBM Plex Mono',monospace; background:none; border:1px solid var(--border); color:var(--ink); width:26px;height:26px; cursor:pointer; font-size:14px; line-height:1; }
  .week-nav button:hover{background:var(--paper);}
  .week-range{ font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:500; }
  .week-input{ font-family:'IBM Plex Mono',monospace; font-size:12px; border:1px solid var(--border); background:var(--paper); padding:3px 4px; }
  .sync-row{ display:flex; align-items:center; gap:6px; }
  .sync-dot{ width:7px;height:7px;border-radius:50%; background:var(--ok); flex-shrink:0; }
  .sync-dot.stale{ background:var(--warn); }
  .sync-text{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); }
  .refresh-btn{ font-family:'IBM Plex Mono',monospace; font-size:10px; background:none; border:1px solid var(--border); color:var(--ink-soft); padding:2px 6px; cursor:pointer; margin-top:6px; }
  .refresh-btn:hover{ border-color:var(--ink); color:var(--ink); }
  .dept-filter{ font-family:'IBM Plex Mono',monospace; font-size:11px; border:1px solid var(--border); background:var(--paper); padding:3px 6px; margin-top:6px; }

  .legend{ display:flex; flex-wrap:wrap; gap:10px; padding:10px 18px; border-bottom:1px solid var(--border); font-size:11px; align-items:center; }
  .legend-label{ font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); margin-right:2px; }
  .chip{ display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:2px; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; color:#fff; }
  .chip .swatch{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.8);}
  .cap-key{ display:flex; gap:8px; align-items:center; font-size:10.5px; color:var(--ink-soft); }
  .cap-dot{ width:8px;height:8px;border-radius:50%; display:inline-block; margin-right:3px; }
  .aww-note-legend{ font-size:10.5px; color:var(--ink-soft); font-style:italic; }

  .grid-wrap{overflow-x:auto;}
  table.schedule{ width:100%; border-collapse:collapse; min-width:1550px; }
  table.schedule.two-week{ min-width:2650px; }
  table.schedule th, table.schedule td{ border:1px solid var(--border); vertical-align:middle; }
  table.schedule thead th{ background:var(--ink); color:var(--card); font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:8px 8px; text-align:left; position:sticky; top:0; white-space:nowrap; }
  td.designer-cell{ width:118px; padding:8px; background:#DCE4E8; font-weight:700; font-size:13px; text-align:center; }
  td.designer-cell .rm{ display:block; margin:0 auto 4px; cursor:pointer; color:var(--ink-soft); font-size:10px; border:none;background:none; }
  td.designer-cell .rm:hover{color:var(--redline);}
  td.designer-cell .role{ display:block; font-weight:400; font-size:10px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; margin-top:3px; }
  .dept-badge{ display:inline-block; margin-top:5px; font-family:'IBM Plex Mono',monospace; font-size:8.5px; text-transform:uppercase; letter-spacing:.04em; padding:1px 6px; border-radius:2px; color:#fff; }
  .dept-badge.design{ background:#2C5F7C; }
  .dept-badge.technical{ background:#7A4B8A; }

  td.field-cell{ padding:0; background:var(--card); }
  tr.alt td.field-cell{ background:var(--row-alt); }
  td.field-cell input, td.field-cell select{ width:100%; height:100%; border:none; background:transparent; padding:6px 6px; font-family:'Inter',sans-serif; font-size:12px; color:var(--ink); }
  td.field-cell input:focus, td.field-cell select:focus{ outline:2px solid var(--ink); outline-offset:-2px; background:#fff; }
  td.field-cell.narrow{ width:88px; }
  td.field-cell.wide{ width:140px; }
  td.field-cell.status-wide{ width:230px; }
  select.stage-select{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:11px; -webkit-appearance:none; -moz-appearance:none; appearance:none; }
  .proj-num-wrap{ display:flex; align-items:center; gap:2px; padding-left:2px; }
  .rm-row{ border:none; background:none; color:var(--ink-soft); cursor:pointer; font-size:11px; flex-shrink:0; padding:0 2px; }
  .rm-row:hover{ color:var(--redline); }

  td.day-cell{ width:78px; padding:4px; background:var(--card); vertical-align:top; }
  tr.alt td.day-cell{ background:var(--row-alt); }
  td.day-cell.is-off{ background-image:repeating-linear-gradient(135deg, var(--off-hatch-a), var(--off-hatch-a) 6px, var(--off-hatch-b) 6px, var(--off-hatch-b) 7px); }
  td.day-cell.is-pto{ background-image:repeating-linear-gradient(135deg, var(--pto-hatch-a), var(--pto-hatch-a) 6px, var(--pto-hatch-b) 6px, var(--pto-hatch-b) 7px); }
  .hrs-input{ width:100%; border:1px solid var(--border); background:#fff; text-align:center; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13px; padding:3px 2px; color:var(--ink); }
  td.day-cell.is-off .hrs-input{ color:var(--redline); border-color:var(--redline); background:rgba(255,255,255,.55); }
  td.day-cell.is-pto .hrs-input{ color:#8A3E3E; border-color:#8A3E3E; background:rgba(255,255,255,.55); }
  .hrs-input:focus{ outline:2px solid var(--ink); outline-offset:-1px; }
  .note-input{ width:100%; border:none; background:transparent; text-align:center; margin-top:3px; font-family:'Inter',sans-serif; font-style:italic; font-size:9.5px; color:var(--ink-soft); padding:1px; }
  .note-input:focus{ outline:1px dashed var(--ink-soft); background:#fff; }
  .note-input::placeholder{ color:#B0A996; }

  tr.pto-row td{ background:#F1E4E4; padding:5px 6px; }
  tr.pto-row td.designer-cell{ background:#DCE4E8; }
  tr.pto-row td.field-cell{ background:#F1E4E4; text-align:right; padding:5px 8px; }
  tr.pto-row .pto-cell{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  tr.pto-row .pto-cell label{ font-family:'IBM Plex Mono',monospace; font-size:9px; color:#8A3E3E; text-transform:uppercase; }

  tr.totals-row td{ background:#EFE9DC; padding:5px 6px; }
  tr.totals-row td.designer-cell{ background:#DCE4E8; }
  tr.totals-row td.field-cell{ background:#EFE9DC; text-align:right; padding:5px 8px; }
  .totals-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); }
  .totals-cell{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .totals-hrs{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12px; padding:2px 6px; border-radius:2px; color:#fff; }
  .totals-hrs.match{ background:var(--ok); }
  .totals-hrs.under{ background:var(--warn); }
  .totals-hrs.over{ background:var(--redline); }
  .totals-hrs.neutral{ background:#8b8272; }
  .split-btn{ font-family:'IBM Plex Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:.04em; background:none; border:1px solid var(--border); color:var(--ink-soft); padding:1px 5px; cursor:pointer; }
  .split-btn:hover{ border-color:var(--ink); color:var(--ink); }

  tr.add-row td{ padding:5px 8px; background:var(--paper); border-top:none; }
  tr.add-row button{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; background:none; border:1px dashed var(--border); color:var(--ink-soft); padding:3px 9px; cursor:pointer; }
  tr.add-row button:hover{ border-color:var(--ink); color:var(--ink); }

  .toolbar{ display:flex; justify-content:space-between; align-items:center; padding:12px 18px; flex-wrap:wrap; gap:10px; }
  .toolbar .group{display:flex; gap:8px; flex-wrap:wrap;}
  .btn{ font-family:'Inter',sans-serif; font-size:12px; padding:5px 10px; border:1px solid var(--border); background:var(--card); cursor:pointer; color:var(--ink); }
  .btn:hover{border-color:var(--ink-soft);}
  .btn.primary{background:var(--ink); color:var(--card); border-color:var(--ink);}
  .btn.primary:hover{background:#3a444c;}
  .btn.danger{color:var(--redline); border-color:var(--redline);}
  .btn.small{padding:3px 7px; font-size:11px;}
  .btn.active{background:var(--ink); color:var(--card); border-color:var(--ink);}

  .panel{ border-top:2px solid var(--ink); padding:16px 18px 20px; display:none; }
  .panel.open{display:block;}
  .panel h3{ font-family:'Space Grotesk',sans-serif; font-size:14px; margin:0 0 10px; text-transform:uppercase; letter-spacing:.04em; }
  label.small{font-size:11px; color:var(--ink-soft); display:block; margin-top:4px;}
  .member-settings-row{display:flex; flex-direction:column; gap:6px; padding:8px 0; border-bottom:1px solid var(--paper-line); max-width:760px;}
  .member-settings-row .line1{display:flex; gap:6px;}
  .member-settings-row .line2{display:flex; gap:14px; align-items:center; font-size:11.5px; color:var(--ink-soft); flex-wrap:wrap;}
  .member-settings-row input[type=text]{border:1px solid var(--border); padding:4px 6px; font-family:'Inter',sans-serif; font-size:12.5px;}
  .member-settings-row select{border:1px solid var(--border); padding:4px 6px; font-family:'Inter',sans-serif; font-size:12.5px;}

  table.phrs{ width:100%; border-collapse:collapse; max-width:960px; }
  table.phrs th, table.phrs td{ border:1px solid var(--border); padding:6px 8px; font-size:12px; text-align:left; }
  table.phrs th{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; background:var(--paper); color:var(--ink-soft); }
  table.phrs td.num{ font-family:'IBM Plex Mono',monospace; font-weight:700; text-align:right; }
  table.phrs tr:nth-child(even) td{ background:var(--row-alt); }
  table.phrs tr.grand-total td{ background:var(--ink); color:var(--card); font-weight:700; }
  table.phrs tr.grand-total td.num{ color:var(--card); }
  .phrs-empty{ color:var(--ink-soft); font-size:12px; padding:10px 0; }

  .workload-block{ margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--paper-line); max-width:760px; }
  .workload-name{ font-weight:700; font-size:13px; }
  .workload-name .dept-badge{ margin-left:6px; margin-top:0; vertical-align:middle; }
  .workload-list{ margin:6px 0 0; padding-left:18px; font-size:12px; }
  .workload-list li{ margin-bottom:3px; }
  .workload-count{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); }

  @media print{
    body{background:#fff; padding:0;}
    .sheet{border:none; box-shadow:none;}
    .toolbar, .panel{display:none !important;}
    .week-nav button, .refresh-btn{display:none;}
    tr.add-row{display:none !important;}
    .split-btn, .rm-row{display:none !important;}
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="titleblock">
    <div class="tb-cell">
      <div class="tb-label">Studio</div>
      <input class="studio-name" id="studioName" value="KTGY LA Studio">
      <div class="sheet-title">Weekly Studio Schedule</div>
    </div>
    <div class="tb-cell">
      <div class="tb-label">Week Of</div>
      <div class="week-nav">
        <button id="prevWeek">‹</button>
        <span class="week-range" id="weekRange">—</span>
        <button id="nextWeek">›</button>
      </div>
      <input type="date" class="week-input" id="weekPicker" style="margin-top:6px;">
    </div>
    <div class="tb-cell">
      <div class="tb-label">Team Size</div>
      <div class="week-range" id="teamSize">0</div>
      <select class="dept-filter" id="deptFilter">
        <option value="all">All Departments</option>
        <option value="Design">Design Team</option>
        <option value="Technical">Technical Team</option>
      </select>
    </div>
    <div class="tb-cell">
      <div class="tb-label">Shared Sync</div>
      <div class="sync-row"><span class="sync-dot" id="syncDot"></span><span class="sync-text" id="syncText">connecting…</span></div>
      <button class="refresh-btn" id="refreshBtn">Refresh now</button>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="grid-wrap">
    <table class="schedule" id="scheduleTable">
      <thead>
        <tr id="scheduleHeadRow"></tr>
      </thead>
      <tbody id="scheduleBody"></tbody>
    </table>
  </div>

  <div class="toolbar">
    <div class="group">
      <button class="btn" id="addMemberBtn">+ Add team member</button>
      <button class="btn" id="oneWeekBtn">1 Week</button>
      <button class="btn" id="twoWeekBtn">2 Weeks</button>
      <button class="btn" id="printBtn">Print / Export</button>
    </div>
    <div class="group">
      <button class="btn" id="workloadBtn">Team Workload</button>
      <button class="btn" id="projectHoursBtn">Project Hours</button>
      <button class="btn" id="settingsBtn">Team &amp; AWW/PTO Settings</button>
    </div>
  </div>

  <div class="panel" id="settingsPanel">
    <h3>Team Members, Department, AWW &amp; PTO</h3>
    <label class="small">Each person's Alternative Work Week (AWW) day off is tracked individually: set an anchor
      date (a Friday they had off) and every other Friday from that date auto-marks their Friday cells off.
      PTO is entered directly on the schedule grid in the PTO row for each week — check a day to mark that
      person out, and it shades the same way AWW days do. Department controls which badge shows next to their
      name and can be used to filter the schedule view above.</label>
    <div id="memberListSettings" style="margin-top:8px;"></div>
  </div>

  <div class="panel" id="workloadPanel">
    <h3>Team Workload — Projects per Team Member</h3>
    <label class="small">A quick roster-wide view of who is on what. Updates automatically as project rows are
      added, removed, or reassigned.</label>
    <div id="workloadContent" style="margin-top:10px;"></div>
  </div>

  <div class="panel" id="projectHoursPanel">
    <h3>Project Hours &amp; Budget Tracker</h3>
    <label class="small">Totals across every team member and every week that has been entered into the schedule.
      Recalculates automatically whenever the schedule is edited or refreshes, so this always reflects the
      latest saved data.</label>
    <div id="projectHoursContent" style="margin-top:10px;"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
const DAY_KEYS = ['mon','tue','wed','thu','fri'];
const DAY_LABELS = {mon:'Mon', tue:'Tue', wed:'Wed', thu:'Thu', fri:'Fri'};
const POLL_MS = 15000;

const UNIFIED_STAGES = [
  {id:'ds',  name:'DS',  label:'Density Studies',          color:'#2C5F7C'},
  {id:'con', name:'CON', label:'Concept Design',            color:'#4B8A5E'},
  {id:'es',  name:'ES',  label:'Entitlement Sets',          color:'#B8862B'},
  {id:'sd',  name:'SD',  label:'Schematic Design',          color:'#6B5B95'},
  {id:'dd',  name:'DD',  label:'Design Development',        color:'#3E8E8A'},
  {id:'cd',  name:'CD',  label:'Construction Documents',    color:'#8A5A3E'},
  {id:'ca',  name:'CA',  label:'Construction Admin',        color:'#7A4B8A'},
];

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }

function defaultState(){
  // Used only if there is truly nothing in Firebase yet (brand-new deployment
  // with no legacy data to migrate).
  const t1 = uid(), t2 = uid();
  return {
    studioName: 'KTGY LA Studio',
    anchorOffFriday: '2026-01-02',
    stages: UNIFIED_STAGES,
    team: [
      {id:t1, name:'Alyssa', role:'Designer', department:'Design', awwEnabled:true, awwAnchor:'2026-01-02'},
      {id:t2, name:'Fernanda', role:'Technical Project Manager', department:'Technical', awwEnabled:false, awwAnchor:'2026-01-02'},
    ],
    rows: [
      {id:uid(), teamId:t1, projectNumber:'', projectName:'Sample Project', client:'', location:'', stageId:'con', designLead:'', qaqcDate:'', techLead:'', projectType:'', projectStatus:''},
      {id:uid(), teamId:t2, projectNumber:'', projectName:'Sample Project', client:'', location:'', stageId:'cd', designLead:'', qaqcDate:'', techLead:'', projectType:'', projectStatus:''},
    ],
    weeks: {}
  };
}

let state = null;
let lastSyncedAt = null;
let weeksToShow = 1;
let deptFilter = 'all';

function mondayOf(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff);
  return d;
}
function iso(d){ return d.toISOString().slice(0,10); }
function fmt(d){ return d.toLocaleDateString('en-US',{month:'short', day:'numeric'}); }
function addDaysIso(dateStr, offsetDays){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + offsetDays);
  return iso(d);
}
function dayDateObj(weekKeyStr, dayIndex){
  const d = new Date(weekKeyStr + 'T00:00:00');
  d.setDate(d.getDate() + dayIndex);
  return d;
}

let currentMonday = iso(mondayOf(iso(new Date())));
function weekKey(){ return currentMonday; }
function fridayDateOf(mondayStr){ const d = new Date(mondayStr + 'T00:00:00'); d.setDate(d.getDate()+4); return d; }
function isAutoOffFriday(mondayStr, anchorDateStr){
  const anchorMonday = mondayOf(anchorDateStr);
  const thisMonday = new Date(mondayStr + 'T00:00:00');
  const diffDays = Math.round((thisMonday - anchorMonday) / 86400000);
  const diffWeeks = Math.round(diffDays / 7);
  return ((diffWeeks % 2) + 2) % 2 === 0;
}

function ensureWeekOn(stateObj, mondayStr){
  if(!stateObj.weeks) stateObj.weeks = {};
  if(!stateObj.weeks[mondayStr]) stateObj.weeks[mondayStr] = { flags:{}, pto:{} };
  if(!stateObj.weeks[mondayStr].flags) stateObj.weeks[mondayStr].flags = {};
  if(!stateObj.weeks[mondayStr].pto) stateObj.weeks[mondayStr].pto = {};
  return stateObj.weeks[mondayStr];
}
function emptyDayEntry(){ return {hours:null, note:''}; }
function ensureRowFlagsOn(stateObj, mondayStr, rowId){
  const wk = ensureWeekOn(stateObj, mondayStr);
  if(!wk.flags[rowId]) wk.flags[rowId] = {mon:emptyDayEntry(),tue:emptyDayEntry(),wed:emptyDayEntry(),thu:emptyDayEntry(),fri:emptyDayEntry()};
  return wk.flags[rowId];
}
function ensurePtoOn(stateObj, mondayStr, teamId){
  const wk = ensureWeekOn(stateObj, mondayStr);
  if(!wk.pto[teamId]) wk.pto[teamId] = {mon:false,tue:false,wed:false,thu:false,fri:false};
  return wk.pto[teamId];
}

// Firebase Realtime Database silently drops keys whose value is an empty
// object/array (e.g. weeks:{} before any hours are logged) — reading that
// path back gives undefined, not {}. Any state coming from an external
// source (cache, Firebase, migration) must be run through this before use,
// so a missing/dropped key can never crash rendering.
function normalizeState(s){
  if(!s || typeof s !== 'object') return defaultState();
  if(!s.weeks || typeof s.weeks !== 'object') s.weeks = {};
  Object.keys(s.weeks).forEach(wk=>{
    if(!s.weeks[wk] || typeof s.weeks[wk] !== 'object') s.weeks[wk] = {};
    if(!s.weeks[wk].flags || typeof s.weeks[wk].flags !== 'object') s.weeks[wk].flags = {};
    if(!s.weeks[wk].pto || typeof s.weeks[wk].pto !== 'object') s.weeks[wk].pto = {};
  });
  if(!Array.isArray(s.stages) || s.stages.length === 0) s.stages = UNIFIED_STAGES;
  if(!Array.isArray(s.team)) s.team = [];
  s.team.forEach(m=>{ if(!m.department) m.department = 'Design'; });
  if(!Array.isArray(s.rows)) s.rows = [];
  if(!s.studioName) s.studioName = 'KTGY LA Studio';
  return s;
}

// ---------- storage layer ----------
// This file works as a plain, standalone .html file opened directly in a
// browser (no server session, no account needed to USE it). Two layers:
//  1) localStorage — instant local cache so your own edits never disappear,
//     even offline.
//  2) Firebase Realtime Database — every teammate's browser reads/writes the

function saveLocalCache(obj){
  try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(obj)); }catch(e){}
}
function loadLocalCache(){

    const raw = localStorage.getItem(LOCAL_CACHE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject)=>setTimeout(()=>reject(new Error('timed out')), ms))
  ]);
}

// ---------- one-time merge of the two legacy schedules ----------
// Design-team stage ids collided with Technical-team stage ids (both used
// "cd" for two different things: Concept Design vs Construction Documents).
// "cd" is remapped to Construction Documents (the more standard usage) and
// Design's Concept Design becomes "con" in the unified stage list, so no
// project silently changes meaning during the merge.
const DESIGN_STAGE_REMAP = { ds:'ds', cd:'con', es:'es' };
const TECHNICAL_STAGE_REMAP = { sd:'sd', dd:'dd', cd:'cd', ca:'ca' };

function mergeLegacyDatasets(designData, technicalData){
  const team = [];
  const rows = [];
  const weeks = {};

  function pull(data, department, idPrefix, stageRemap){
    if(!data) return;
    (data.team || []).forEach(m=>{
      const copy = Object.assign({}, m);
      copy.id = idPrefix + m.id;
      copy.department = department;
      team.push(copy);
    });
    (data.rows || []).forEach(r=>{
      const copy = Object.assign({}, r);
      copy.id = idPrefix + r.id;
      copy.teamId = idPrefix + r.teamId;
      copy.stageId = stageRemap[r.stageId] || r.stageId || '';
      rows.push(copy);
    });
    Object.keys(data.weeks || {}).forEach(wkKey=>{
      if(!weeks[wkKey]) weeks[wkKey] = { flags:{}, pto:{} };
      const srcFlags = (data.weeks[wkKey] || {}).flags || {};
      Object.keys(srcFlags).forEach(rowId=>{
        weeks[wkKey].flags[idPrefix + rowId] = srcFlags[rowId];
      });
      const srcPto = (data.weeks[wkKey] || {}).pto || {};
      Object.keys(srcPto).forEach(teamId=>{
        weeks[wkKey].pto[idPrefix + teamId] = srcPto[teamId];
      });
    });
  }

  pull(designData, 'Design', 'd_', DESIGN_STAGE_REMAP);
  pull(technicalData, 'Technical', 't_', TECHNICAL_STAGE_REMAP);

  return normalizeState({
    studioName: 'KTGY LA Studio',
    anchorOffFriday: '2026-01-02',
    stages: UNIFIED_STAGES,
    team, rows, weeks
  });
}

// Runs once per deployment: if the unified path already has data, use it
// as-is (migration already happened). Otherwise, pull both legacy datasets,
// merge them, and write the result to the unified path. Nothing is deleted
// from the legacy paths — they remain as an untouched backup.
async function migrateLegacyIfNeeded(){
  try{
    const unifiedSnap = await withTimeout(scheduleRef.get(), 5000);
    if(unifiedSnap.exists()) return normalizeState(unifiedSnap.val());
  }catch(e){ /* fall through and attempt migration below */ }

  let designData = null, technicalData = null;
  try{
    const s = await withTimeout(db.ref(LEGACY_DESIGN_PATH).get(), 5000);
    if(s.exists()) designData = s.val();
  }catch(e){}
  try{
    const s = await withTimeout(db.ref(LEGACY_TECHNICAL_PATH).get(), 5000);
    if(s.exists()) technicalData = s.val();
  }catch(e){}

  if(!designData && !technicalData) return null; // nothing to migrate

  const merged = mergeLegacyDatasets(designData, technicalData);
  try{ await withTimeout(scheduleRef.set(merged), 8000); }catch(e){ console.error('Migration write failed', e); }
  return merged;
}

// Apply a change to local state RIGHT NOW — synchronous, no network involved.
// The caller can re-render immediately without waiting on anything.
function mutateState(mutatorFn){
  if(!state) state = defaultState();
  mutatorFn(state);
  saveLocalCache(state);
  syncToCloudInBackground();
}

// Push the current local state to Firebase in the background. This never
// blocks the UI: if it's slow, hangs, or fails (blocked network, denied
// permissions, offline), the person editing never notices — their own
// screen already updated instantly via mutateState() above.
function syncToCloudInBackground(){
  const snapshot = state;
  withTimeout(scheduleRef.set(snapshot), 6000)
    .then(()=> updateSyncIndicator(true))
    .catch(e=>{ console.error('Cloud save failed', e); updateSyncIndicator(false); });
}

async function pullLatest(){
  try{
    const snap = await withTimeout(scheduleRef.get(), 5000);
    if(snap.exists()){
      const incomingObj = snap.val();
      if(JSON.stringify(incomingObj) !== JSON.stringify(state)){
        state = normalizeState(incomingObj);
        saveLocalCache(state);
        renderAll();
      }
      updateSyncIndicator(true);
      return;
    }
  }catch(e){}
  updateSyncIndicator(false);
}

function isEditingNow(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = el.tagName;
  return (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') && document.querySelector('.sheet').contains(el);
}

function updateSyncIndicator(ok){
  const dot = document.getElementById('syncDot');
  const text = document.getElementById('syncText');
  if(!firebaseAvailable){
    dot.classList.add('stale');
    text.textContent = 'not connected — working locally only, not shared with your team';
    return;
  }
  if(ok){
    dot.classList.remove('stale');
    text.textContent = 'synced live';
  } else {
    dot.classList.add('stale');
    text.textContent = 'offline — showing last saved copy';
  }
}

scheduleRef.on('value', (snap) => {
  if(!snap.exists()) return;
  const incomingObj = snap.val();
  if(isEditingNow()) return; // don't yank the field out from under an active edit
  if(JSON.stringify(incomingObj) !== JSON.stringify(state)){
    state = normalizeState(incomingObj);
    saveLocalCache(state);
    renderAll();
  }
  updateSyncIndicator(true);
});
db.ref('.info/connected').on('value', (snap) => {
  updateSyncIndicator(snap.val() === true);
});

async function load(){
  const cached = loadLocalCache();
  if(cached) state = normalizeState(cached);

  try{
    const migrated = await migrateLegacyIfNeeded();
    if(migrated){
      state = migrated;
      saveLocalCache(state);
      return;
    }
  }catch(e){ /* fall through to cache/default below */ }

  if(!state){
    state = defaultState();
    saveLocalCache(state);
    withTimeout(scheduleRef.set(state), 5000).catch(()=>{});
  }
}

function stageById(id){ return state.stages.find(s=>s.id===id); }
function memberById(id){ return state.team.find(t=>t.id===id); }
function rowsForMember(teamId){ return state.rows.filter(r=>r.teamId===teamId); }
function visibleTeam(){ return deptFilter==='all' ? state.team : state.team.filter(m=>m.department===deptFilter); }

function isMemberAutoOffFriday(member, wkKey){
  if(!member.awwEnabled) return false;
  return isAutoOffFriday(wkKey, member.awwAnchor || state.anchorOffFriday);
}
function isMemberPTO(member, wkKey, day){
  const wk = state.weeks[wkKey];
  return !!(wk && wk.pto && wk.pto[member.id] && wk.pto[member.id][day]);
}
// Returns {isOff, label} — PTO takes precedence over AWW if somehow both apply.
function dayOffInfo(member, wkKey, day){
  if(isMemberPTO(member, wkKey, day)) return {isOff:true, label:'PTO'};
  if(day === 'fri' && isMemberAutoOffFriday(member, wkKey)) return {isOff:true, label:'AWW'};
  return {isOff:false, label:null};
}
function dailyCapacity(member, day, wkKey){
  if(isMemberPTO(member, wkKey, day)) return 0;
  if(day !== 'fri') return member.awwEnabled ? 9 : 8;
  if(!member.awwEnabled) return 8;
  return isMemberAutoOffFriday(member, wkKey) ? 0 : 8;
}
function roundHalf(x){ return Math.round(x*2)/2; }
function activeWeekKeys(){
  const offsets = weeksToShow === 2 ? [0,7] : [0];
  return offsets.map(off => addDaysIso(currentMonday, off));
}

          html += '<td class="designer-cell" rowspan="' + rowspan + '">' +
            '<button class="rm" data-rm-member="' + member.id + '" title="Remove team member">x remove</button>' +
            escapeAttr(member.name) +
            '<span class="role">' + escapeAttr(member.role||'') + '</span>' + deptBadge +
          '</td>';
        }
        html += '<td class="field-cell narrow"><div class="proj-num-wrap">' +
          '<button class="rm-row" data-rm-row="' + row.id + '" title="Remove this project">x</button>' +
          '<input type="text" data-field="projectNumber" data-row="' + row.id + '" value="' + escapeAttr(row.projectNumber) + '" style="flex:1;font-family:\'IBM Plex Mono\',monospace;font-weight:600;">' +
          '</div></td>';
        html += fieldCell(row.id,'projectName',row.projectName,'wide');

        html += '<td class="field-cell narrow"><select class="stage-select" data-field="stageId" data-row="' + row.id + '" style="background:' + (stage?stage.color:'transparent') + '; color:' + (stage?'#fff':'inherit') + ';"><option value="">-</option>' +

          '</select></td>';
        html += fieldCell(row.id,'designLead',row.designLead,'narrow');
        html += '<td class="field-cell narrow"><input type="date" data-field="qaqcDate" data-row="' + row.id + '" value="' + (row.qaqcDate||'') + '"></td>';
        html += fieldCell(row.id,'techLead',row.techLead,'narrow');
        html += fieldCell(row.id,'projectType',row.projectType,'wide');
        html += fieldCell(row.id,'projectStatus',row.projectStatus,'status-wide');

        wkKeys.forEach(wkKey=>{

          const flags = (wk && wk.flags[row.id]) || {mon:emptyDayEntry(),tue:emptyDayEntry(),wed:emptyDayEntry(),thu:emptyDayEntry(),fri:emptyDayEntry()};
          DAY_KEYS.forEach(day=>{

      wkKeys.forEach(wkKey=>{

          rows.forEach(row=>{

            const entry = flags[day];
            if(entry && entry.hours) daySum += Number(entry.hours);
          });
          const cap = dailyCapacity(member, day, wkKey);
          actualsByWeekDay.push({wkKey, day, daySum, cap});
        });
      });
      actualsByWeekDay.forEach(a=>{
        let cls = 'neutral';
        if(a.cap === 0 && a.daySum === 0) cls = 'neutral';

function wireTableEvents(){
  document.querySelectorAll('[data-rm-member]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(confirm('Remove this team member and all their project rows? Historical hours remain in storage but will no longer be shown.')){
        const memberId = btn.dataset.rmMember;
        mutateState(s=>{
          s.team = s.team.filter(m=>m.id!==memberId);
          s.rows = s.rows.filter(r=>r.teamId!==memberId);
        });
        renderAll();
      }
    });
  });

  document.querySelectorAll('[data-rm-row]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const rowId = btn.dataset.rmRow;
      const row = state.rows.find(r=>r.id===rowId);
      const label = row ? (row.projectName || row.projectNumber || 'this project') : 'this project';
      if(confirm('Remove "' + label + '" from this designer? Logged hours for it remain in storage but will no longer be shown.')){
        mutateState(s=>{ s.rows = s.rows.filter(r=>r.id!==rowId); });
        renderAll();
      }
    });
  });

  document.querySelectorAll('td.field-cell input[data-field], td.field-cell select[data-field]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const rowId = el.dataset.row, field = el.dataset.field, value = el.value;
      mutateState(s=>{
        const row = s.rows.find(r=>r.id===rowId);
        if(row) row[field] = value;
      });
      renderTable();
    });
  });

  document.querySelectorAll('.hrs-input, .note-input').forEach(el=>{
    el.addEventListener('change', ()=>{
      const rowId = el.dataset.flagrow, wkKey = el.dataset.week, day = el.dataset.day, field = el.dataset.field, value = el.value;
      mutateState(s=>{
        const entry = ensureRowFlagsOn(s, wkKey, rowId)[day] || emptyDayEntry();
        if(field === 'hours') entry.hours = (value === '' ? null : Number(value));
        else entry.note = value;
        ensureRowFlagsOn(s, wkKey, rowId)[day] = entry;
      });
      renderTable();
    });
  });

  document.querySelectorAll('[data-pto-member]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const teamId = el.dataset.ptoMember, wkKey = el.dataset.ptoWeek, day = el.dataset.ptoDay, checked = el.checked;
      mutateState(s=>{
        const pto = ensurePtoOn(s, wkKey, teamId);
        pto[day] = checked;
      });
      renderTable();
    });
  });

  document.querySelectorAll('.split-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const memberId = btn.dataset.splitMember, wkKey = btn.dataset.splitWeek, day = btn.dataset.splitDay;
      mutateState(s=>{
        const member = s.team.find(t=>t.id===memberId);
        const rows = s.rows.filter(r=>r.teamId===memberId);
        const cap = dailyCapacity(member, day, wkKey);
        const share = rows.length ? roundHalf(cap / rows.length) : 0;
        rows.forEach(row=>{
          const entry = ensureRowFlagsOn(s, wkKey, row.id)[day] || emptyDayEntry();
          entry.hours = share;
          ensureRowFlagsOn(s, wkKey, row.id)[day] = entry;
        });
      });
      renderTable();
    });
  });

  document.querySelectorAll('[data-add-project]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const teamId = btn.dataset.addProject;
      mutateState(s=>{
        s.rows.push({ id:uid(), teamId, projectNumber:'', projectName:'', client:'', location:'', stageId:'', designLead:'', qaqcDate:'', techLead:'', projectType:'', projectStatus:'' });
      });
      renderAll();
    });
  });
}

    inp.addEventListener('change', ()=>{ const id=inp.dataset.editRole, val=inp.value; mutateState(s=>{ const m=s.team.find(t=>t.id===id); if(m) m.role=val; }); renderAll(); });
  });
  memberSettings.querySelectorAll('[data-edit-department]').forEach(sel=>{
    sel.addEventListener('change', ()=>{ const id=sel.dataset.editDepartment, val=sel.value; mutateState(s=>{ const m=s.team.find(t=>t.id===id); if(m) m.department=val; }); renderAll(); });
  });
  memberSettings.querySelectorAll('[data-edit-aww-enabled]').forEach(inp=>{
    inp.addEventListener('change', ()=>{ const id=inp.dataset.editAwwEnabled, val=inp.checked; mutateState(s=>{ const m=s.team.find(t=>t.id===id); if(m) m.awwEnabled=val; }); renderAll(); });
  });
  memberSettings.querySelectorAll('[data-edit-aww-anchor]').forEach(inp=>{
    inp.addEventListener('change', ()=>{ const id=inp.dataset.editAwwAnchor, val=inp.value; mutateState(s=>{ const m=s.team.find(t=>t.id===id); if(m) m.awwAnchor=val; }); renderAll(); });
  });
}

function renderWorkloadPanel(){
  const el = document.getElementById('workloadContent');
  if(state.team.length === 0){
    el.innerHTML = '<div class="phrs-empty">No team members yet.</div>';
    return;
  }
  el.innerHTML = state.team.map(m=>{
    const rows = rowsForMember(m.id);
    const deptClass = m.department==='Technical' ? 'technical' : 'design';
    const items = rows.length
      ? rows.map(r=>{
          const stage = stageById(r.stageId);
          const stageChip = stage ? ('<span class="chip" style="background:'+stage.color+'; margin-left:6px;">'+stage.name+'</span>') : '';
          return '<li>' + escapeAttr(r.projectNumber || '(no #)') + ' — ' + escapeAttr(r.projectName || '(untitled)') + stageChip + '</li>';
        }).join('')
      : '<li style="color:var(--ink-soft);">No projects assigned</li>';
    return '<div class="workload-block">' +
      '<div class="workload-name">' + escapeAttr(m.name) + '<span class="dept-badge ' + deptClass + '">' + escapeAttr(m.department||'Design') + '</span> ' +
      '<span class="workload-count">(' + rows.length + ' project' + (rows.length===1?'':'s') + ')</span></div>' +
      '<ul class="workload-list">' + items + '</ul>' +
    '</div>';
  }).join('');
}

function computeProjectTotals(){
  const map = {};
  state.rows.forEach(row=>{
    const numKey = (row.projectNumber || '').trim().toLowerCase();
    const nameKey = (row.projectName || '').trim().toLowerCase();
    const key = numKey ? ('num:' + numKey) : ('name:' + nameKey || ('row:' + row.id));
    if(!map[key]){
      map[key] = {
        projectNumber: row.projectNumber && row.projectNumber.trim() ? row.projectNumber.trim() : '(no #)',
        projectName: row.projectName && row.projectName.trim() ? row.projectName.trim() : '(untitled)',
        client: row.client || '',
        contributors: new Set(),
        totalAllTime: 0,
        totalThisWeek: 0
      };
    }
    const entry = map[key];
    if(!entry.client && row.client) entry.client = row.client;
    if(entry.projectName === '(untitled)' && row.projectName) entry.projectName = row.projectName;
    entry.contributors.add(row.teamId);

    Object.keys(state.weeks || {}).forEach(wkKeyIter=>{
      const wk = state.weeks[wkKeyIter];
      const flags = wk.flags[row.id];
      if(!flags) return;
      DAY_KEYS.forEach(d=>{
        const h = flags[d] && flags[d].hours ? Number(flags[d].hours) : 0;
        if(!h) return;
        entry.totalAllTime += h;
        if(wkKeyIter === weekKey()) entry.totalThisWeek += h;
      });
    });
  });
  return Object.values(map).sort((a,b)=> b.totalAllTime - a.totalAllTime);
}

function renderProjectHoursPanel(){
  const el = document.getElementById('projectHoursContent');
  const totals = computeProjectTotals();

  if(totals.length === 0){
    el.innerHTML = '<div class="phrs-empty">No project rows yet. Add projects under each team member and log hours to see totals here.</div>';
    return;
  }

  let grandAllTime = 0, grandThisWeek = 0;
  let rowsHtml = totals.map(p=>{
    grandAllTime += p.totalAllTime;
    grandThisWeek += p.totalThisWeek;
    const contributorNames = Array.from(p.contributors).map(id=>{
      const m = memberById(id);
      return m ? m.name : 'unknown';
    }).join(', ');
    return '<tr>' +
      '<td>' + escapeAttr(p.projectNumber) + '</td>' +
      '<td>' + escapeAttr(p.projectName) + '</td>' +
      '<td>' + escapeAttr(p.client) + '</td>' +
      '<td>' + escapeAttr(contributorNames) + '</td>' +
      '<td class="num">' + (p.totalThisWeek || 0) + '</td>' +
      '<td class="num">' + (p.totalAllTime || 0) + '</td>' +
    '</tr>';
  }).join('');

  rowsHtml += '<tr class="grand-total">' +
    '<td colspan="4">Studio Total</td>' +
    '<td class="num">' + grandThisWeek + '</td>' +
    '<td class="num">' + grandAllTime + '</td>' +
  '</tr>';

  el.innerHTML = '<table class="phrs"><thead><tr>' +
    '<th>Project #</th><th>Project Name</th><th>Client</th><th>Contributors</th><th>This Week Hrs</th><th>All-Time Hrs</th>' +
    '</tr></thead><tbody>' + rowsHtml + '</tbody></table>';
}
