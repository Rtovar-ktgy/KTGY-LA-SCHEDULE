<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTGY LA Studio — Weekly Schedule</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
  :root {
    --paper:#ECE8DE;
    --paper-line:#D8D2C2;
    --ink:#20262B;
    --ink-soft:#565F66;
    --redline:#C4401D;
    --off-hatch-a:#DCD6C8;
    --off-hatch-b:#CBC4B2;
    --pto-hatch-a:#E6D6D6;
    --pto-hatch-b:#D6BEBE;
    --card:#F7F5EF;
    --border:#B9B2A0;
    --row-alt:#F1EEE5;
    --ok:#4B8A5E;
    --warn:#B8862B;
  }

  * { box-sizing:border-box; }
  [hidden] { display:none !important; }

  body {
    margin:0;
    padding:24px;
    min-height:100vh;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size:28px 28px;
  }

  button, input, select { font:inherit; }
  button:disabled { opacity:.55; cursor:not-allowed; }

  .sheet {
    max-width:1700px;
    margin:0 auto;
    background:var(--card);
    border:1px solid var(--border);
    box-shadow:
      0 2px 0 rgba(32,38,43,.08),
      0 12px 30px rgba(32,38,43,.10);
  }

  .auth-panel { margin-bottom:16px; }
  .auth-content {
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    padding:16px 18px;
  }
  .auth-title {
    margin:0 0 5px;
    font-family:'Space Grotesk',sans-serif;
    font-size:19px;
  }
  .auth-message {
    margin:0;
    font-size:12px;
    color:var(--ink-soft);
    overflow-wrap:anywhere;
  }
  .auth-actions { display:flex; gap:8px; flex-wrap:wrap; }

  .titleblock {
    display:grid;
    grid-template-columns:1.4fr 1fr 1fr 1fr;
    border-bottom:2px solid var(--ink);
  }
  .tb-cell { padding:14px 18px; border-right:1px solid var(--border); }
  .tb-cell:last-child { border-right:none; }
  .tb-label {
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .studio-name {
    width:100%;
    padding:0;
    border:none;
    background:transparent;
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:-.01em;
  }
  .studio-name:focus {
    outline:none;
    border-bottom:1px dashed var(--ink-soft);
  }
  .sheet-title {
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--redline);
    margin-top:2px;
  }
  .week-nav { display:flex; align-items:center; gap:8px; }
  .week-nav button {
    width:26px;
    height:26px;
    border:1px solid var(--border);
    background:none;
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    line-height:1;
    cursor:pointer;
  }
  .week-nav button:hover { background:var(--paper); }
  .week-range {
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    font-weight:500;
  }
  .week-input {
    margin-top:6px;
    border:1px solid var(--border);
    background:var(--paper);
    padding:3px 4px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
  }
  .sync-row { display:flex; align-items:center; gap:6px; }
  .sync-dot {
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--ok);
    flex-shrink:0;
  }
  .sync-dot.stale { background:var(--warn); }
  .sync-text {
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--ink-soft);
  }
  .refresh-btn {
    margin-top:6px;
    padding:2px 6px;
    border:1px solid var(--border);
    background:none;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    cursor:pointer;
  }
  .refresh-btn:hover { border-color:var(--ink); color:var(--ink); }
  .dept-filter {
    margin-top:6px;
    padding:3px 6px;
    border:1px solid var(--border);
    background:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
  }

  .legend {
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    padding:10px 18px;
    border-bottom:1px solid var(--border);
    font-size:11px;
  }
  .legend-label {
    font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--ink-soft);
    margin-right:2px;
  }
  .chip {
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:2px 8px;
    border-radius:2px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:600;
    color:#fff;
  }
  .chip .swatch {
    width:7px;
    height:7px;
    border-radius:50%;
    background:rgba(255,255,255,.8);
  }
  .cap-key {
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    font-size:10.5px;
    color:var(--ink-soft);
  }
  .cap-dot {
    width:8px;
    height:8px;
    border-radius:50%;
    display:inline-block;
    margin-right:3px;
  }
  .aww-note-legend {
    font-size:10.5px;
    color:var(--ink-soft);
    font-style:italic;
  }

  .grid-wrap { overflow-x:auto; }
  table.schedule {
    width:100%;
    border-collapse:collapse;
    min-width:1550px;
  }
  table.schedule.two-week { min-width:2650px; }
  table.schedule th, table.schedule td {
    border:1px solid var(--border);
    vertical-align:middle;
  }
  table.schedule thead th {
    background:var(--ink);
    color:var(--card);
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:8px;
    text-align:left;
    position:sticky;
    top:0;
    white-space:nowrap;
  }
  td.designer-cell {
    width:118px;
    padding:8px;
    background:#DCE4E8;
    font-weight:700;
    font-size:13px;
    text-align:center;
  }
  td.designer-cell .rm {
    display:block;
    margin:0 auto 4px;
    border:none;
    background:none;
    color:var(--ink-soft);
    font-size:10px;
    cursor:pointer;
  }
  td.designer-cell .rm:hover { color:var(--redline); }
  td.designer-cell .role {
    display:block;
    margin-top:3px;
    font-weight:400;
    font-size:10px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
  }
  .dept-badge {
    display:inline-block;
    margin-top:5px;
    padding:1px 6px;
    border-radius:2px;
    color:#fff;
    font-family:'IBM Plex Mono',monospace;
    font-size:8.5px;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .dept-badge.design { background:#2C5F7C; }
  .dept-badge.technical { background:#7A4B8A; }

  td.field-cell { padding:0; background:var(--card); }
  tr.alt td.field-cell { background:var(--row-alt); }
  td.field-cell input, td.field-cell select {
    width:100%;
    height:100%;
    border:none;
    background:transparent;
    padding:6px;
    font-family:'Inter',sans-serif;
    font-size:12px;
    color:var(--ink);
  }
  td.field-cell input:focus, td.field-cell select:focus {
    outline:2px solid var(--ink);
    outline-offset:-2px;
    background:#fff;
  }
  td.field-cell.narrow { width:88px; }
  td.field-cell.wide { width:140px; }
  td.field-cell.status-wide { width:230px; }
  td.field-cell input.mono {
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
  }
  select.stage-select {
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:11px;
    appearance:none;
  }
  .proj-num-wrap {
    display:flex;
    align-items:center;
    gap:2px;
    padding-left:2px;
  }
  .proj-num-wrap input { flex:1; min-width:0; }
  .rm-row {
    border:none;
    background:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:11px;
    flex-shrink:0;
    padding:0 2px;
  }
  .rm-row:hover { color:var(--redline); }

  td.day-cell {
    width:78px;
    padding:4px;
    background:var(--card);
    vertical-align:top;
  }
  tr.alt td.day-cell { background:var(--row-alt); }
  td.day-cell.is-off {
    background-image:repeating-linear-gradient(
      135deg,
      var(--off-hatch-a),
      var(--off-hatch-a) 6px,
      var(--off-hatch-b) 6px,
      var(--off-hatch-b) 7px
    );
  }
  td.day-cell.is-pto {
    background-image:repeating-linear-gradient(
      135deg,
      var(--pto-hatch-a),
      var(--pto-hatch-a) 6px,
      var(--pto-hatch-b) 6px,
      var(--pto-hatch-b) 7px
    );
  }
  .hrs-input {
    width:100%;
    border:1px solid var(--border);
    background:#fff;
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:13px;
    padding:3px 2px;
    color:var(--ink);
  }
  td.day-cell.is-off .hrs-input {
    color:var(--redline);
    border-color:var(--redline);
    background:rgba(255,255,255,.55);
  }
  td.day-cell.is-pto .hrs-input {
    color:#8A3E3E;
    border-color:#8A3E3E;
    background:rgba(255,255,255,.55);
  }
  .hrs-input:focus { outline:2px solid var(--ink); outline-offset:-1px; }
  .note-input {
    width:100%;
    border:none;
    background:transparent;
    text-align:center;
    margin-top:3px;
    font-family:'Inter',sans-serif;
    font-style:italic;
    font-size:9.5px;
    color:var(--ink-soft);
    padding:1px;
  }
  .note-input:focus { outline:1px dashed var(--ink-soft); background:#fff; }
  .note-input::placeholder { color:#B0A996; }

  tr.pto-row td { background:#F1E4E4; padding:5px 6px; }
  tr.pto-row td.field-cell { text-align:right; padding:5px 8px; }
  .pto-cell { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .pto-cell label {
    font-family:'IBM Plex Mono',monospace;
    font-size:9px;
    color:#8A3E3E;
    text-transform:uppercase;
  }
  tr.totals-row td { background:#EFE9DC; padding:5px 6px; }
  tr.totals-row td.field-cell { text-align:right; padding:5px 8px; }
  .totals-label {
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-soft);
  }
  .totals-cell {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .totals-hrs {
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:12px;
    padding:2px 6px;
    border-radius:2px;
    color:#fff;
  }
  .totals-hrs.match { background:var(--ok); }
  .totals-hrs.under { background:var(--warn); }
  .totals-hrs.over { background:var(--redline); }
  .totals-hrs.neutral { background:#8b8272; }
  .split-btn {
    font-family:'IBM Plex Mono',monospace;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.04em;
    background:none;
    border:1px solid var(--border);
    color:var(--ink-soft);
    padding:1px 5px;
    cursor:pointer;
  }
  .split-btn:hover { border-color:var(--ink); color:var(--ink); }
  tr.add-row td { padding:5px 8px; background:var(--paper); border-top:none; }
  tr.add-row button {
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.05em;
    background:none;
    border:1px dashed var(--border);
    color:var(--ink-soft);
    padding:3px 9px;
    cursor:pointer;
  }
  tr.add-row button:hover { border-color:var(--ink); color:var(--ink); }

  .toolbar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 18px;
    flex-wrap:wrap;
    gap:10px;
  }
  .toolbar .group { display:flex; gap:8px; flex-wrap:wrap; }
  .btn {
    font-family:'Inter',sans-serif;
    font-size:12px;
    padding:5px 10px;
    border:1px solid var(--border);
    background:var(--card);
    cursor:pointer;
    color:var(--ink);
  }
  .btn:hover { border-color:var(--ink-soft); }
  .btn.primary, .btn.active {
    background:var(--ink);
    color:var(--card);
    border-color:var(--ink);
  }
  .btn.primary:hover { background:#3a444c; }

  .panel {
    border-top:2px solid var(--ink);
    padding:16px 18px 20px;
    display:none;
  }
  .panel.open { display:block; }
  .panel h3 {
    font-family:'Space Grotesk',sans-serif;
    font-size:14px;
    margin:0 0 10px;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  label.small {
    font-size:11px;
    color:var(--ink-soft);
    display:block;
    margin-top:4px;
  }
  .member-settings-row {
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:8px 0;
    border-bottom:1px solid var(--paper-line);
    max-width:760px;
  }
  .member-settings-row .line1 { display:flex; gap:6px; flex-wrap:wrap; }
  .member-settings-row .line2 {
    display:flex;
    gap:14px;
    align-items:center;
    font-size:11.5px;
    color:var(--ink-soft);
    flex-wrap:wrap;
  }
  .member-settings-row input[type=text],
  .member-settings-row select {
    border:1px solid var(--border);
    padding:4px 6px;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
  }
  .member-settings-row input[type=text] { flex:1; min-width:140px; }
  .inline-label { display:flex; align-items:center; gap:4px; }

  table.phrs {
    width:100%;
    border-collapse:collapse;
    max-width:960px;
  }
  table.phrs th, table.phrs td {
    border:1px solid var(--border);
    padding:6px 8px;
    font-size:12px;
    text-align:left;
  }
  table.phrs th {
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.05em;
    background:var(--paper);
    color:var(--ink-soft);
  }
  table.phrs td.num {
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    text-align:right;
  }
  table.phrs tr:nth-child(even) td { background:var(--row-alt); }
  table.phrs tr.grand-total td {
    background:var(--ink);
    color:var(--card);
    font-weight:700;
  }
  .phrs-empty { color:var(--ink-soft); font-size:12px; padding:10px 0; }
  .workload-block {
    margin-bottom:14px;
    padding-bottom:10px;
    border-bottom:1px solid var(--paper-line);
    max-width:760px;
  }
  .workload-name { font-weight:700; font-size:13px; }
  .workload-name .dept-badge {
    margin-left:6px;
    margin-top:0;
    vertical-align:middle;
  }
  .workload-list { margin:6px 0 0; padding-left:18px; font-size:12px; }
  .workload-list li { margin-bottom:3px; }
  .workload-count {
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--ink-soft);
  }

  @media (max-width:800px) {
    body { padding:12px; }
    .titleblock { grid-template-columns:1fr 1fr; }
    .tb-cell { border-bottom:1px solid var(--border); }
  }

  @media print {
    body { background:#fff; padding:0; }
    .sheet { border:none; box-shadow:none; }
    #authPanel, .toolbar, .panel { display:none !important; }
    .week-nav button, .refresh-btn, .dept-filter { display:none; }
    tr.add-row { display:none !important; }
    .split-btn, .rm-row, .rm { display:none !important; }
    .grid-wrap { overflow:visible; }
  }
</style>
</head>

<body>

<section class="sheet auth-panel" id="authPanel">
  <div class="auth-content">
    <div>
      <h1 class="auth-title">KTGY LA Studio Schedule</h1>
      <p class="auth-message" id="authMessage" role="status" aria-live="polite">
        Starting authentication…
      </p>
    </div>

    <div class="auth-actions">
      <button class="btn primary" id="signInBtn" type="button" hidden>
        Sign in with Microsoft
      </button>
      <button class="btn" id="retryBtn" type="button" hidden>
        Retry loading
      </button>
      <button class="btn" id="signOutBtn" type="button" hidden>
        Sign out
      </button>
    </div>
  </div>
</section>

<noscript>
  <p>This application requires JavaScript and company Microsoft sign-in.</p>
</noscript>

<div class="sheet" id="scheduleApp" hidden>
  <div class="titleblock">
    <div class="tb-cell">
      <div class="tb-label">Studio</div>
      <input class="studio-name" id="studioName" value="" maxlength="150"
             aria-label="Studio name">
      <div class="sheet-title">Weekly Studio Schedule</div>
    </div>

    <div class="tb-cell">
      <div class="tb-label">Week Of</div>
      <div class="week-nav">
        <button id="prevWeek" type="button" aria-label="Previous week">‹</button>
        <span class="week-range" id="weekRange">—</span>
        <button id="nextWeek" type="button" aria-label="Next week">›</button>
      </div>
      <input type="date" class="week-input" id="weekPicker"
             aria-label="Choose week">
    </div>

    <div class="tb-cell">
      <div class="tb-label">Team Size</div>
      <div class="week-range" id="teamSize">0</div>
      <select class="dept-filter" id="deptFilter" aria-label="Department">
        <option value="all">All Departments</option>
        <option value="Design">Design Team</option>
        <option value="Technical">Technical Team</option>
      </select>
    </div>

    <div class="tb-cell">
      <div class="tb-label">Shared Sync</div>
      <div class="sync-row">
        <span class="sync-dot stale" id="syncDot"></span>
        <span class="sync-text" id="syncText" role="status">Not connected</span>
      </div>
      <button class="refresh-btn" id="refreshBtn" type="button">
        Refresh now
      </button>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="grid-wrap">
    <table class="schedule" id="scheduleTable">
      <thead><tr id="scheduleHeadRow"></tr></thead>
      <tbody id="scheduleBody"></tbody>
    </table>
  </div>

  <div class="toolbar">
    <div class="group">
      <button class="btn" id="addMemberBtn" type="button">+ Add team member</button>
      <button class="btn" id="oneWeekBtn" type="button">1 Week</button>
      <button class="btn" id="twoWeekBtn" type="button">2 Weeks</button>
      <button class="btn" id="printBtn" type="button">Print / Export</button>
    </div>
    <div class="group">
      <button class="btn" id="workloadBtn" type="button">Team Workload</button>
      <button class="btn" id="projectHoursBtn" type="button">Project Hours</button>
      <button class="btn" id="settingsBtn" type="button">
        Team &amp; AWW/PTO Settings
      </button>
    </div>
  </div>

  <div class="panel" id="settingsPanel">
    <h3>Team Members, Department, AWW &amp; PTO</h3>
    <label class="small">
      Set an anchor Friday off for each Alternative Work Week team member.
      Every other Friday from that date is marked off.
      Enter PTO using the checkboxes in the schedule.
      Department controls the badge and department filter.
    </label>
    <div id="memberListSettings" style="margin-top:8px;"></div>
  </div>

  <div class="panel" id="workloadPanel">
    <h3>Team Workload — Projects per Team Member</h3>
    <label class="small">
      A roster-wide view of project assignments.
    </label>
    <div id="workloadContent" style="margin-top:10px;"></div>
  </div>

  <div class="panel" id="projectHoursPanel">
    <h3>Project Hours &amp; Budget Tracker</h3>
    <label class="small">
      Totals across every team member and recorded week.
      “This Week” refers to the first displayed week.
      Removed project rows are excluded from these totals.
    </label>
    <div class="grid-wrap" id="projectHoursContent" style="margin-top:10px;"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
'use strict';

// ============================================================================
// CONFIGURATION
// ============================================================================

// Entra app registration → Overview → Directory (tenant) ID.
// This is a public identifier. Never put the Entra client secret in this file.
const ENTRA_TENANT_ID = '9c0c8b54-6ae5-48b0-87aa-4c327c01af71';

// ============================================================================

// ============================================================================

function uid() {
  return crypto.randomUUID();
}

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, character => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[character]);
}

function safeColor(value) {
  return /^#[0-9a-f]{6}$/i.test(String(value)) ? value : '#565F66';
}

function isObject(value) {
  return value !== null && typeof value === 'object' && !Array.isArray(value);
}

function normalizeState(raw) {
  if (!isObject(raw)) {
    throw new Error('The schedule data has an invalid structure.');
  }

  const s = JSON.parse(JSON.stringify(raw));

  // Firebase omits empty objects and arrays.
  if (s.team == null) s.team = [];
  if (s.rows == null) s.rows = [];

  if (!Array.isArray(s.team) || !Array.isArray(s.rows)) {
    throw new Error('The schedule team or project list is invalid.');
  }

  if (
    s.team.some(member => !isObject(member) || typeof member.id !== 'string') ||
    s.rows.some(row => !isObject(row) || typeof row.id !== 'string')
  ) {
    throw new Error('A team member or project row is invalid.');
  }

  if (!Array.isArray(s.stages) || s.stages.length === 0) {
    s.stages = JSON.parse(JSON.stringify(UNIFIED_STAGES));
  }

  if (s.stages.some(stage => !isObject(stage))) {
    throw new Error('The project stage list is invalid.');
  }

  if (!isObject(s.weeks)) s.weeks = {};

  Object.keys(s.weeks).forEach(key => {
    if (!isObject(s.weeks[key])) s.weeks[key] = {};
    if (!isObject(s.weeks[key].flags)) s.weeks[key].flags = {};
    if (!isObject(s.weeks[key].pto)) s.weeks[key].pto = {};
  });

  s.team.forEach(member => {
    if (!member.department) member.department = 'Design';
  });

  if (!s.studioName) s.studioName = 'KTGY LA Studio';
  if (!s.anchorOffFriday) s.anchorOffFriday = '2026-01-02';

  return s;
}

function localISO(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function parseDate(value) {
  return new Date(value + 'T12:00:00');
}

function validDate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(value))) return false;
  const date = parseDate(value);
  return !Number.isNaN(date.getTime()) && localISO(date) === value;
}

function mondayOf(value) {
  const date = parseDate(value);
  const day = date.getDay();
  date.setDate(date.getDate() + (day === 0 ? -6 : 1 - day));
  return localISO(date);
}

function addDaysISO(value, days) {
  const date = parseDate(value);
  date.setDate(date.getDate() + days);
  return localISO(date);
}

function fmt(value) {
  return parseDate(value).toLocaleDateString('en-US', {
    month:'short',
    day:'numeric'
  });
}

function activeWeekKeys() {
  return weeksToShow === 2
    ? [currentMonday, addDaysISO(currentMonday, 7)]
    : [currentMonday];
}

function utcDayNumber(value) {
  const [year, month, day] = value.split('-').map(Number);
  return Date.UTC(year, month - 1, day) / 86400000;
}

function isAutoOffFriday(week, anchor) {
  if (!validDate(anchor)) return false;

  const diffWeeks =
    (utcDayNumber(week) - utcDayNumber(mondayOf(anchor))) / 7;

  return ((diffWeeks % 2) + 2) % 2 === 0;
}

function ensureWeek(s, week) {
  if (!isObject(s.weeks)) s.weeks = {};
  if (!isObject(s.weeks[week])) s.weeks[week] = {};
  if (!isObject(s.weeks[week].flags)) s.weeks[week].flags = {};
  if (!isObject(s.weeks[week].pto)) s.weeks[week].pto = {};
  return s.weeks[week];
}

function ensureDay(s, week, rowId, day) {
  const wk = ensureWeek(s, week);

  if (!isObject(wk.flags[rowId])) wk.flags[rowId] = {};
  if (!isObject(wk.flags[rowId][day])) {
    wk.flags[rowId][day] = {hours:null, note:''};
  }

  return wk.flags[rowId][day];
}

function ensurePTO(s, week, memberId) {
  const wk = ensureWeek(s, week);
  if (!isObject(wk.pto[memberId])) wk.pto[memberId] = {};
  return wk.pto[memberId];
}

function hoursValue(entry) {
  const number = Number(entry?.hours);
  return Number.isFinite(number) ? number : 0;
}

function memberPTO(s, memberId, week, day) {
  return !!s.weeks?.[week]?.pto?.[memberId]?.[day];
}

function dayOffInfo(s, member, week, day) {
  if (memberPTO(s, member.id, week, day)) {
    return {isOff:true, label:'PTO'};
  }

  if (
    day === 'fri' &&
    member.awwEnabled &&
    isAutoOffFriday(week, member.awwAnchor || s.anchorOffFriday)
  ) {
    return {isOff:true, label:'AWW'};
  }

  return {isOff:false, label:''};
}

function dailyCapacity(s, member, week, day) {
  if (dayOffInfo(s, member, week, day).isOff) return 0;
  if (day === 'fri') return 8;
  return member.awwEnabled ? 9 : 8;
}

function visibleTeam() {
  return deptFilter === 'all'
    ? state.team
    : state.team.filter(member => member.department === deptFilter);
}

function rowsForMember(memberId, s = state) {
  return s.rows.filter(row => row.teamId === memberId);
}

function stageById(id) {
  return state.stages.find(stage => stage.id === id);
}

function requireMember(s, memberId) {
  const member = s.team.find(item => item.id === memberId);
  if (!member) throw new Error('This team member was removed. Reload the schedule.');
  return member;
}

function requireRow(s, rowId) {
  const row = s.rows.find(item => item.id === rowId);
  if (!row) throw new Error('This project row was removed. Reload the schedule.');
  return row;
}

function isEditingNow() {
  const active = document.activeElement;
  return !!(
    active &&
    app.contains(active) &&
    ['INPUT', 'SELECT', 'TEXTAREA'].includes(active.tagName)
  );
}

function requestRender() {
  if (!ready || !state) return;

  if (isEditingNow()) {
    renderDeferred = true;
    return;
  }

  renderAll();
}

function setAuthMessage(message) {
  $('authMessage').textContent = message;
}

function refreshSyncIndicator() {
  let message;
  let healthy = false;

  if (writeFailed) {
    message = 'Save failed — reload before editing';
  } else if (pendingWrites > 0) {
    message = connected
      ? `Saving… (${pendingWrites})`
      : 'Save pending — reconnect; keep this tab open';
  } else if (!connected) {
    message = 'Disconnected — editing disabled';
  } else if (!ready) {
    message = 'Loading…';
  } else {
    healthy = true;
    message = 'synced live';
  }

  $('syncDot').classList.toggle('stale', !healthy);
  $('syncText').textContent = message;

  $('signOutBtn').disabled = pendingWrites > 0;
  $('refreshBtn').disabled = pendingWrites > 0;
}

// ============================================================================
// AUTHENTICATION AND DATABASE LIFECYCLE
// ============================================================================

function sameSession(version, userId) {
  return (
    sessionVersion === version &&
    auth?.currentUser?.uid === userId
  );
}

function clearScheduleView() {
  app.hidden = true;

  [
    'legend',
    'scheduleHeadRow',
    'scheduleBody',
    'memberListSettings',
    'workloadContent',
    'projectHoursContent'
  ].forEach(id => $(id).replaceChildren());

  $('studioName').value = '';
  $('teamSize').textContent = '0';
  $('weekRange').textContent = '—';

  document.querySelectorAll('.panel').forEach(panel => {
    panel.classList.remove('open');
  });
}

function stopScheduleSession() {
  ready = false;

  if (scheduleListener && scheduleRef) {
    scheduleRef.off('value', scheduleListener);
  }

  if (connectionListener && connectionRef) {
    connectionRef.off('value', connectionListener);
  }

  scheduleListener = null;
  connectionListener = null;
  connectionRef = null;

  state = null;
  connected = false;
  writeFailed = false;
  pendingWrites = 0;
  writeQueue = Promise.resolve();
  renderDeferred = false;

  clearScheduleView();
  refreshSyncIndicator();
}

function describeLoadError(error) {
  const code = String(error?.code || '').toLowerCase();

  if (code.includes('permission')) {
    return 'Signed in, but Firebase denied schedule access. ' +
      'Check the Realtime Database rules for schedule_unified_v1.';
  }

  return error?.message ||
    'The schedule could not be loaded. Check your connection and retry.';
}

function failScheduleSession(error) {
  console.error('Schedule unavailable:', error);

  // Invalidate unfinished work from this session.
  sessionVersion++;
  stopScheduleSession();

  $('retryBtn').hidden = !auth?.currentUser;
  $('signOutBtn').hidden = !auth?.currentUser;
  setAuthMessage(describeLoadError(error));
}

async function readSchedule() {
  const snap = await scheduleRef.get();

  if (!snap.exists()) {
    throw new Error(
      'No schedule exists at schedule_unified_v1. ' +
      'An administrator must initialize or migrate the data. ' +
      'This page will not automatically create or overwrite it.'
    );
  }

  return normalizeState(snap.val());
}

function attachLiveListeners(version, userId) {
  scheduleListener = snap => {
    if (!sameSession(version, userId)) return;

    try {
      if (!snap.exists()) {
        throw new Error('The schedule was removed from the database.');
      }

      state = normalizeState(snap.val());
      requestRender();
    } catch (error) {
      failScheduleSession(error);
    }
  };

  scheduleRef.on('value', scheduleListener, error => {
    if (sameSession(version, userId)) failScheduleSession(error);
  });

  connectionRef = db.ref('.info/connected');
  connectionListener = snap => {
    if (!sameSession(version, userId)) return;
    connected = snap.val() === true;
    refreshSyncIndicator();
  };

  connectionRef.on('value', connectionListener);
}

async function handleAuthStateChanged(user) {
  const version = ++sessionVersion;
  stopScheduleSession();

  $('signInBtn').hidden = !!user;
  $('signOutBtn').hidden = !user;
  $('retryBtn').hidden = true;

  if (!user) {
    setAuthMessage('Sign in with your company Microsoft account.');
    return;
  }

  setAuthMessage('Signed in. Loading the shared schedule…');

  try {
    const incoming = await readSchedule();
    if (!sameSession(version, user.uid)) return;

    state = incoming;
    ready = true;

    renderAll();
    app.hidden = false;

    setAuthMessage(
      'Signed in as ' + (user.email || user.displayName || 'company user')
    );

    attachLiveListeners(version, user.uid);
  } catch (error) {
    if (sameSession(version, user.uid)) failScheduleSession(error);
  }
}

async function signIn() {
  if (!auth || signInBusy) return;

  if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i
      .test(ENTRA_TENANT_ID)) {
    setAuthMessage(
      'Set ENTRA_TENANT_ID in index.html to your Directory (tenant) ID.'
    );
    return;
  }

  signInBusy = true;
  $('signInBtn').disabled = true;
  setAuthMessage('Opening Microsoft sign-in…');

  try {
    const provider = new firebase.auth.OAuthProvider('microsoft.com');
    provider.setCustomParameters({tenant:ENTRA_TENANT_ID});

    // Invoke directly from the button click so browsers allow the popup.
    await auth.signInWithPopup(provider);
  } catch (error) {
    console.error('Microsoft sign-in failed:', error);

    const messages = {
      'auth/popup-closed-by-user':
        'Sign-in canceled. Click Sign in with Microsoft to try again.',
      'auth/popup-blocked':
        'Your browser blocked the sign-in popup. Allow popups and try again.',
      'auth/unauthorized-domain':
        'This hostname is not authorized in Firebase Authentication. ' +
        'Add rtovar-ktgy.github.io to Authorized domains.',
      'auth/operation-not-allowed':
        'Enable the Microsoft provider in Firebase Authentication.',
      'auth/network-request-failed':
        'Sign-in could not reach Firebase. Check your connection.'
    };

    setAuthMessage(
      messages[error.code] ||
      'Sign-in failed: ' + (error.code || 'unknown error')
    );
  } finally {
    signInBusy = false;
    $('signInBtn').disabled = false;
  }
}

async function signOut() {
  if (!auth || pendingWrites > 0) return;

  $('signOutBtn').disabled = true;

  try {
    await auth.signOut();
  } catch (error) {
    console.error('Sign-out failed:', error);
    setAuthMessage('Sign-out failed. Please try again.');
  } finally {
    $('signOutBtn').disabled = pendingWrites > 0;
  }
}

async function initializeAuthentication() {
  clearScheduleView();

  // Remove known caches from previous unauthenticated versions.
  // This version does not persist schedule data in localStorage.
  try {
    [
      'ktgy-schedule-cache-unified-v1',
      'ktgy-schedule-cache-v1',
      'studio-schedule-v2',
      'studio-schedule-v3'
    ].forEach(key => localStorage.removeItem(key));
  } catch (error) {
    console.warn('Could not clear old browser caches:', error);
  }

  try {
    if (
      typeof firebase === 'undefined' ||
      typeof firebase.auth !== 'function' ||
      typeof firebase.database !== 'function'
    ) {
      throw new Error('The Firebase SDK could not load.');
    }

    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.database();
    scheduleRef = db.ref(UNIFIED_PATH);

    await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);

    auth.onAuthStateChanged(user => {
      void handleAuthStateChanged(user);
    }, error => {
      console.error('Authentication observer failed:', error);
      sessionVersion++;
      stopScheduleSession();
      setAuthMessage('Authentication failed. Reload the page to try again.');
    });
  } catch (error) {
    console.error('Application startup failed:', error);
    $('signInBtn').hidden = true;
    $('signOutBtn').hidden = true;
    setAuthMessage(
      'Authentication could not start. Check your connection and reload. ' +
      (error.message || '')
    );
  }
}

// ============================================================================
// DATABASE WRITES
// ============================================================================

// Mutations are queued within this tab and applied as RTDB transactions.
// Firebase retries a transaction against newer data if another client writes.
// Mutators must be synchronous and safe to run more than once.

function mutateState(mutator) {
  if (
    !auth?.currentUser ||
    !ready ||
    !state ||
    !connected ||
    writeFailed
  ) {
    alert(
      'Editing is unavailable. Check your connection, or reload ' +
      'if a previous save failed.'
    );
    if (state && ready) renderAll();
    return Promise.resolve(false);
  }

  const version = sessionVersion;
  const userId = auth.currentUser.uid;

  pendingWrites++;
  refreshSyncIndicator();

  const operation = writeQueue.then(async () => {
    if (!sameSession(version, userId) || !ready || writeFailed) {
      return false;
    }

    const result = await scheduleRef.transaction(current => {
      if (!sameSession(version, userId) || !ready || writeFailed) {
        return undefined;
      }

      // Never seed an absent schedule from a client's cached data.
      if (current === null) return undefined;

      const next = normalizeState(current);
      mutator(next);
      return next;
    }, undefined, false);

    if (!sameSession(version, userId)) return false;

    if (!result.committed) {
      throw new Error(
        'The edit was not committed. Reload the schedule before editing again.'
      );
    }

    // The live listener supplies the latest state, including other users' edits.
    return true;
  }).catch(error => {
    if (sameSession(version, userId)) {
      console.error('Schedule save failed:', error);
      writeFailed = true;

      setAuthMessage(
        'An edit could not be saved. Reload before editing again. ' +
        (error.message || '')
      );

      if (ready && state) renderAll();
    }

    return false;
  }).finally(() => {
    if (sameSession(version, userId)) {
      pendingWrites--;
      refreshSyncIndicator();
      requestRender();
    }
  });

  writeQueue = operation;
  return operation;
}

async function refreshSchedule() {
  if (!auth?.currentUser || !ready || pendingWrites > 0) return;

  // Rebuild the authenticated session and discard any failed local input.
  await handleAuthStateChanged(auth.currentUser);
}

function renderAll() {
  if (!ready || !state) return;
  renderDeferred = false;

  $('studioName').value = state.studioName;
  $('weekPicker').value = currentMonday;
  $('deptFilter').value = deptFilter;

  const weeks = activeWeekKeys();
  $('weekRange').textContent =
    fmt(currentMonday) + ' - ' + fmt(addDaysISO(weeks[weeks.length - 1], 4));

  $('teamSize').textContent = visibleTeam().length;
  $('oneWeekBtn').classList.toggle('active', weeksToShow === 1);
  $('twoWeekBtn').classList.toggle('active', weeksToShow === 2);
  $('scheduleTable').classList.toggle('two-week', weeksToShow === 2);

  renderLegend();
  renderTableHead();
  renderTable();
  renderSettings();
  renderWorkload();
  renderProjectHours();
}

function renderLegend() {
  $('legend').innerHTML =
    '<span class="legend-label">Stages</span>' +
    state.stages.map(stage =>
      `<span class="chip" style="background:${safeColor(stage.color)}">
        <span class="swatch"></span>
        ${escapeHTML(stage.name)} - ${escapeHTML(stage.label)}
      </span>`
    ).join('') +
    `<span class="cap-key">
      <span><span class="cap-dot" style="background:var(--ok)"></span>at capacity</span>
      <span><span class="cap-dot" style="background:var(--warn)"></span>under</span>
      <span><span class="cap-dot" style="background:var(--redline)"></span>over</span>
    </span>
    <span class="aww-note-legend">
      Blue-grey hatch = AWW day off. Red hatch = PTO.
      Enter hours to show work on an off day.
    </span>`;
}

function renderTableHead() {
  const headers = [
    'Designer', 'Project #', 'Project Name', 'Client', 'Stage',
    'Design Lead', 'QAQC Date', 'Tech Lead', 'Project Type', 'Project Status'
  ];

  let html = headers.map(label => `<th>${escapeHTML(label)}</th>`).join('');

  activeWeekKeys().forEach(week => {
    DAY_KEYS.forEach((day, index) => {
      html += `<th>${DAY_LABELS[day]} ${fmt(addDaysISO(week, index))}</th>`;
    });
  });

  $('scheduleHeadRow').innerHTML = html;
}

function fieldCell(row, field, width = 'wide', type = 'text') {
  return `<td class="field-cell ${width}">
    <input type="${type}" data-row="${escapeHTML(row.id)}"
      data-field="${field}" value="${escapeHTML(row[field])}"
      ${type === 'text' ? 'maxlength="500"' : ''}
      aria-label="${field}">
  </td>`;
}

function designerCell(member, rowspan) {
  const department = member.department || 'Design';
  const badge = department === 'Technical' ? 'technical' : 'design';

  return `<td class="designer-cell" rowspan="${rowspan}">
    <button class="rm" type="button"
      data-action="remove-member" data-member="${escapeHTML(member.id)}">
      x remove
    </button>
    ${escapeHTML(member.name)}
    <span class="role">${escapeHTML(member.role)}</span>
    <span class="dept-badge ${badge}">${escapeHTML(department)}</span>
  </td>`;
}

function renderTable() {
  const weeks = activeWeekKeys();
  const totalColumns = 10 + weeks.length * 5;
  const team = visibleTeam();

  if (!team.length) {
    $('scheduleBody').innerHTML =
      `<tr><td colspan="${totalColumns}" style="padding:20px;text-align:center">
        No team members match this filter.
      </td></tr>`;
    return;
  }

  let html = '';

  team.forEach((member, memberIndex) => {
    const rows = rowsForMember(member.id);
    const stripe = memberIndex % 2 ? 'alt' : '';

    // Project/placeholder rows + PTO + totals.
    // The add-project row sits outside the designer's rowspan.
    const rowspan = Math.max(rows.length, 1) + 2;

    if (!rows.length) {
      html += `<tr class="${stripe}">
        ${designerCell(member, rowspan)}
        <td colspan="${totalColumns - 1}"
            style="text-align:center;padding:10px;color:var(--ink-soft)">
          No projects assigned
        </td>
      </tr>`;
    }

    rows.forEach((row, index) => {
      const stage = stageById(row.stageId);

      html += `<tr class="${stripe}">`;
      if (index === 0) html += designerCell(member, rowspan);

      html += `<td class="field-cell narrow">
        <div class="proj-num-wrap">
          <button class="rm-row" type="button" data-action="remove-row"
            data-row="${escapeHTML(row.id)}" title="Remove this project">x</button>
          <input type="text" class="mono" maxlength="100"
            data-row="${escapeHTML(row.id)}" data-field="projectNumber"
            value="${escapeHTML(row.projectNumber)}" aria-label="Project number">
        </div>
      </td>`;

      html += fieldCell(row, 'projectName');
      html += fieldCell(row, 'client');

      html += `<td class="field-cell narrow">
        <select class="stage-select" data-row="${escapeHTML(row.id)}"
          data-field="stageId" aria-label="Project stage"
          style="background:${stage ? safeColor(stage.color) : 'transparent'};
                 color:${stage ? '#fff' : 'inherit'}">
          <option value="">-</option>
          ${state.stages.map(item =>
            `<option value="${escapeHTML(item.id)}"
              ${row.stageId === item.id ? 'selected' : ''}>
              ${escapeHTML(item.name)}
            </option>`
          ).join('')}
        </select>
      </td>`;

      html += fieldCell(row, 'designLead', 'narrow');
      html += fieldCell(row, 'qaqcDate', 'narrow', 'date');
      html += fieldCell(row, 'techLead', 'narrow');
      html += fieldCell(row, 'projectType');
      html += fieldCell(row, 'projectStatus', 'status-wide');

      weeks.forEach(week => {
        DAY_KEYS.forEach(day => {
          const entry = state.weeks[week]?.flags?.[row.id]?.[day] || {};
          const off = dayOffInfo(state, member, week, day);
          const shaded = off.isOff && hoursValue(entry) === 0;
          const shadeClass = shaded
            ? (off.label === 'PTO' ? 'is-pto' : 'is-off')
            : '';

          html += `<td class="day-cell ${shadeClass}">
            <input class="hrs-input" type="number" min="0" max="16" step="0.5"
              data-entry="hours" data-row="${escapeHTML(row.id)}"
              data-week="${week}" data-day="${day}"
              value="${escapeHTML(entry.hours ?? '')}"
              placeholder="${shaded ? off.label.toLowerCase() : 'hrs'}"
              aria-label="${DAY_LABELS[day]} hours">
            <input class="note-input" type="text" maxlength="500"
              data-entry="note" data-row="${escapeHTML(row.id)}"
              data-week="${week}" data-day="${day}"
              value="${escapeHTML(entry.note)}"
              placeholder="note" aria-label="${DAY_LABELS[day]} note">
          </td>`;
        });
      });

      html += '</tr>';
    });

    html += `<tr class="pto-row">
      <td class="field-cell" colspan="9">
        <span class="totals-label">
          PTO (check to mark out) - ${escapeHTML(member.name)}
        </span>
      </td>`;

    weeks.forEach(week => {
      DAY_KEYS.forEach(day => {
        html += `<td class="day-cell">
          <div class="pto-cell">
            <label>${DAY_LABELS[day]}</label>
            <input type="checkbox" data-pto="${escapeHTML(member.id)}"
              data-week="${week}" data-day="${day}"
              ${memberPTO(state, member.id, week, day) ? 'checked' : ''}
              aria-label="${DAY_LABELS[day]} PTO">
          </div>
        </td>`;
      });
    });
    html += '</tr>';

    html += `<tr class="totals-row">
      <td class="field-cell" colspan="9">
        <span class="totals-label">
          Daily total vs capacity - ${escapeHTML(member.name)}
        </span>
      </td>`;

    weeks.forEach(week => {
      DAY_KEYS.forEach(day => {
        const sum = rows.reduce((total, row) =>
          total + hoursValue(state.weeks[week]?.flags?.[row.id]?.[day]), 0
        );
        const capacity = dailyCapacity(state, member, week, day);

        const status = capacity === 0 && sum === 0 ? 'neutral'
          : sum === capacity ? 'match'
          : sum < capacity ? 'under'
          : 'over';

        html += `<td class="day-cell">
          <div class="totals-cell">
            <span class="totals-hrs ${status}">${sum}/${capacity}</span>
            ${rows.length > 1
              ? `<button class="split-btn" type="button" data-action="split"
                  data-member="${escapeHTML(member.id)}"
                  data-week="${week}" data-day="${day}">split</button>`
              : ''}
          </div>
        </td>`;
      });
    });
    html += '</tr>';

    html += `<tr class="add-row ${stripe}">
      <td colspan="${totalColumns}">
        <button type="button" data-action="add-row"
          data-member="${escapeHTML(member.id)}">
          + add project for ${escapeHTML(member.name)}
        </button>
      </td>
    </tr>`;
  });

  $('scheduleBody').innerHTML = html;
}

function renderSettings() {
  $('memberListSettings').innerHTML = state.team.map(member =>
    `<div class="member-settings-row">
      <div class="line1">
        <input type="text" maxlength="150" placeholder="Name"
          data-member="${escapeHTML(member.id)}" data-member-field="name"
          value="${escapeHTML(member.name)}" aria-label="Team member name">

        <input type="text" maxlength="150" placeholder="Role"
          data-member="${escapeHTML(member.id)}" data-member-field="role"

        <select data-member="${escapeHTML(member.id)}"
          data-member-field="department" aria-label="Department">
          <option value="Design"
            ${member.department === 'Design' ? 'selected' : ''}>Design</option>
          <option value="Technical"
            ${member.department === 'Technical' ? 'selected' : ''}>Technical</option>
        </select>
      </div>

      <div class="line2">
        <label class="inline-label">
          <input type="checkbox" data-member="${escapeHTML(member.id)}"
            data-member-field="awwEnabled"
            ${member.awwEnabled ? 'checked' : ''}>
          On AWW schedule
        </label>

        <label class="inline-label">
          Anchor off-Friday:
          <input type="date" data-member="${escapeHTML(member.id)}"
            data-member-field="awwAnchor"

  ).join('') || '<div class="phrs-empty">No team members yet.</div>';

function renderWorkload() {
  $('workloadContent').innerHTML = state.team.map(member => {
    const rows = rowsForMember(member.id);
    const department = member.department || 'Design';
    const badge = department === 'Technical' ? 'technical' : 'design';

    const items = rows.map(row => {
      const stage = stageById(row.stageId);

      return `<li>
        ${escapeHTML(row.projectNumber || '(no #)')} —
        ${escapeHTML(row.projectName || '(untitled)')}
        ${stage
          ? `<span class="chip"
              style="background:${safeColor(stage.color)};margin-left:6px">
              ${escapeHTML(stage.name)}
            </span>`
          : ''}
      </li>`;
    }).join('') || '<li>No projects assigned</li>';

    return `<div class="workload-block">
      <div class="workload-name">
        ${escapeHTML(member.name)}
        <span class="dept-badge ${badge}">${escapeHTML(department)}</span>
        <span class="workload-count">
          (${rows.length} project${rows.length === 1 ? '' : 's'})
        </span>
      </div>
      <ul class="workload-list">${items}</ul>
    </div>`;
  }).join('') || '<div class="phrs-empty">No team members yet.</div>';
}

function computeProjectTotals() {
  const projects = new Map();

  state.rows.forEach(row => {
    const number = String(row.projectNumber || '').trim();
    const name = String(row.projectName || '').trim();

    const key = number
      ? 'num:' + number.toLowerCase()
      : name
        ? 'name:' + name.toLowerCase()
        : 'row:' + row.id;

    if (!projects.has(key)) {
      projects.set(key, {
        projectNumber:number || '(no #)',
        projectName:name || '(untitled)',
        client:row.client || '',
        contributors:new Set(),
        totalThisWeek:0,
        totalAllTime:0
      });
    }

    const project = projects.get(key);
    project.contributors.add(row.teamId);

    if (!project.client && row.client) project.client = row.client;
    if (project.projectName === '(untitled)' && name) project.projectName = name;

    Object.entries(state.weeks).forEach(([week, data]) => {
      DAY_KEYS.forEach(day => {
        const hours = hoursValue(data.flags?.[row.id]?.[day]);
        project.totalAllTime += hours;
        if (week === currentMonday) project.totalThisWeek += hours;
      });
    });
  });

  return [...projects.values()].sort((a, b) =>
    b.totalAllTime - a.totalAllTime
  );
}

function renderProjectHours() {
  const totals = computeProjectTotals();

  if (!totals.length) {
    $('projectHoursContent').innerHTML =
      '<div class="phrs-empty">No project rows yet.</div>';
    return;
  }

  let allTime = 0;
  let thisWeek = 0;

  const rows = totals.map(project => {
    allTime += project.totalAllTime;
    thisWeek += project.totalThisWeek;

    const names = [...project.contributors].map(id =>
      state.team.find(member => member.id === id)?.name || 'unknown'
    ).join(', ');

    return `<tr>
      <td>${escapeHTML(project.projectNumber)}</td>
      <td>${escapeHTML(project.projectName)}</td>
      <td>${escapeHTML(project.client)}</td>
      <td>${escapeHTML(names)}</td>
      <td class="num">${project.totalThisWeek}</td>
      <td class="num">${project.totalAllTime}</td>
    </tr>`;
  }).join('');

  $('projectHoursContent').innerHTML = `<table class="phrs">
    <thead>
      <tr>
        <th>Project #</th>
        <th>Project Name</th>
        <th>Client</th>
        <th>Contributors</th>
        <th>This Week Hrs</th>
        <th>All-Time Hrs</th>
      </tr>
    </thead>
    <tbody>
      ${rows}
      <tr class="grand-total">
        <td colspan="4">Studio Total</td>
        <td class="num">${thisWeek}</td>
        <td class="num">${allTime}</td>
      </tr>
    </tbody>
  </table>`;
}

// ============================================================================
// SCHEDULE EVENTS — DELEGATED SO RE-RENDERING DOES NOT DUPLICATE LISTENERS
// ============================================================================

const ROW_FIELDS = new Set([
  'projectNumber', 'projectName', 'client', 'stageId',
  'designLead', 'qaqcDate', 'techLead', 'projectType', 'projectStatus'
]);

$('scheduleBody').addEventListener('change', async event => {
  const input = event.target;
  if (!ready || !state || !input.dataset) return;

  const rowId = input.dataset.row;
  const week = input.dataset.week;
  const day = input.dataset.day;

  if (input.dataset.entry) {
    if (!DAY_KEYS.includes(day) || !validDate(week)) return;

    const field = input.dataset.entry;
    let value = input.value;

    if (field === 'hours') {
      if (
        value !== '' &&
        (
          !input.checkValidity() ||
          !Number.isFinite(Number(value)) ||
          Number(value) < 0 ||
          Number(value) > 16 ||
          !Number.isInteger(Number(value) * 2)
        )
      ) {
        alert('Enter hours from 0 to 16 in half-hour increments.');
        renderAll();
        return;
      }

      value = value === '' ? null : Number(value);
    } else if (field !== 'note') {
      return;
    }

    await mutateState(s => {
      requireRow(s, rowId);
      ensureDay(s, week, rowId, day)[field] = value;
    });
    return;
  }

  if (input.dataset.pto) {
    const memberId = input.dataset.pto;
    const checked = input.checked;

    if (!DAY_KEYS.includes(day) || !validDate(week)) return;

    await mutateState(s => {
      requireMember(s, memberId);
      ensurePTO(s, week, memberId)[day] = checked;
    });
    return;
  }

  const field = input.dataset.field;
  if (!ROW_FIELDS.has(field)) return;

  const value = input.value;

  if (field === 'qaqcDate' && value && !validDate(value)) {
    alert('Enter a valid QAQC date.');
    renderAll();
    return;
  }

  await mutateState(s => {
    const row = requireRow(s, rowId);

    if (
      field === 'stageId' &&
      value &&
      !s.stages.some(stage => stage.id === value)
    ) {
      throw new Error('This project stage no longer exists.');
    }

    row[field] = value;
  });
});

$('scheduleBody').addEventListener('click', async event => {
  const button = event.target.closest('button[data-action]');
  if (!button || !ready || !state) return;

  const action = button.dataset.action;
  const memberId = button.dataset.member;
  const rowId = button.dataset.row;

  if (action === 'remove-member') {
    if (!confirm(
      'Remove this team member and all their project rows? ' +
      'Historical entries remain in storage but will no longer appear in totals.'
    )) return;

    await mutateState(s => {
      s.team = s.team.filter(member => member.id !== memberId);
      s.rows = s.rows.filter(row => row.teamId !== memberId);
    });
    return;
  }

  if (action === 'remove-row') {
    const row = state.rows.find(item => item.id === rowId);
    const label = row?.projectName || row?.projectNumber || 'this project';

    if (!confirm(
      `Remove "${label}"? Historical hours remain in storage ` +
      'but will no longer appear in totals.'
    )) return;

    await mutateState(s => {
      s.rows = s.rows.filter(item => item.id !== rowId);
    });
    return;
  }

  if (action === 'add-row') {
    const newId = uid();

    await mutateState(s => {
      requireMember(s, memberId);

      s.rows.push({
        id:newId,
        teamId:memberId,
        projectNumber:'',
        projectName:'',
        client:'',
        location:'',
        stageId:'',
        designLead:'',
        qaqcDate:'',
        techLead:'',
        projectType:'',
        projectStatus:''
      });
    });
    return;
  }

  if (action === 'split') {
    const week = button.dataset.week;
    const day = button.dataset.day;

    if (!validDate(week) || !DAY_KEYS.includes(day)) return;

    await mutateState(s => {
      const member = requireMember(s, memberId);
      const rows = rowsForMember(memberId, s);
      if (!rows.length) return;

      // Distribute half-hour units while preserving the exact daily total.
      const units = Math.round(dailyCapacity(s, member, week, day) * 2);
      const base = Math.floor(units / rows.length);
      const remainder = units % rows.length;

      rows.forEach((row, index) => {
        ensureDay(s, week, row.id, day).hours =
          (base + (index < remainder ? 1 : 0)) / 2;
      });
    });
  }
});

$('memberListSettings').addEventListener('change', async event => {
  const input = event.target;
  if (!ready || !state) return;

  const memberId = input.dataset.member;
  const field = input.dataset.memberField;

  if (!['name', 'role', 'department', 'awwEnabled', 'awwAnchor'].includes(field)) {
    return;
  }

  let value = field === 'awwEnabled' ? input.checked : input.value;

  if (field === 'name') {
    value = value.trim();
    if (!value) {
      alert('A team member needs a name.');
      renderAll();
      return;
    }
  }

  if (field === 'department' && !['Design', 'Technical'].includes(value)) return;

  if (field === 'awwAnchor') {
    if (!validDate(value) || parseDate(value).getDay() !== 5) {
      alert('Choose a Friday as the AWW anchor date.');
      renderAll();
      return;
    }
  }

  await mutateState(s => {
    requireMember(s, memberId)[field] = value;
  });
});

app.addEventListener('focusout', () => {
  setTimeout(() => {
    if (ready && state && renderDeferred && !isEditingNow()) renderAll();
  }, 0);
});

  if (validDate(event.target.value)) {
    currentMonday = mondayOf(event.target.value);

  renderAll();
});

  if (!value) {
    alert('Enter a studio name.');
    renderAll();
    return;
  }

  await mutateState(s => {
    s.studioName = value;
  });
});

[
  ['settingsBtn', 'settingsPanel'],
  ['workloadBtn', 'workloadPanel'],
  ['projectHoursBtn', 'projectHoursPanel']
].forEach(([button, panel]) => {
  $(button).addEventListener('click', () => {
    if (ready) $(panel).classList.toggle('open');
  });
});

$('printBtn').addEventListener('click', () => {
  if (ready) window.print();
});

$('refreshBtn').addEventListener('click', () => {
  void refreshSchedule();
});

$('addMemberBtn').addEventListener('click', async () => {
  if (!ready) return;

  const name = prompt('Team member name:')?.trim();
  if (!name) return;

  const role = prompt('Role (optional):')?.trim() || '';
  const answer = prompt('Department — Design or Technical:', 'Design');
  if (answer === null) return;

  const department = /^tech/i.test(answer.trim()) ? 'Technical' : 'Design';
  const newId = uid();

  await mutateState(s => {
    s.team.push({
      id:newId,
      name:name.slice(0, 150),
      role:role.slice(0, 150),
      department,
      awwEnabled:false,
      awwAnchor:s.anchorOffFriday || '2026-01-02'
    });
  });
});

window.addEventListener('beforeunload', event => {
  if (pendingWrites > 0) {
    event.preventDefault();
    event.returnValue = '';
  }
});

// No unauthenticated database listeners, polling, migration, or cache loading.
void initializeAuthentication();
